name: User Service CI

on:
  push:
    branches: ["main"]
    paths:
      - "user-service/**"
      - ".github/workflows/user-service-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "user-service/**"
      - ".github/workflows/user-service-ci.yml"

jobs:
  build:
    uses: ./.github/workflows/reusable-backend-ci.yml
    with:
      service-path: "user-service"

name: Order Service Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "order-service/**"
      - ".github/workflows/order-service-deploy.yml"
      - ".github/workflows/reusable-deploy.yml"

jobs:
  deploy:
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      service-path: "order-service"
    secrets: inherit

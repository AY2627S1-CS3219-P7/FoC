name: Reusable Service Deploy

on:
  workflow_call:
    inputs:
      service-path:
        required: true
        type: string

    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: true

permissions:
  # id-token: write
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-southeast-1
      ECR_REPOSITORY: cs3219ay2627s1/p7

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # - name: configure aws credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: arn:aws:iam::551162198630:role/github-actions-connect
      #     aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          SERVICE_PATH: ${{ inputs.service-path }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build \
            -t "$IMAGE:$SERVICE_NAME" \
            -t "$IMAGE:$SERVICE_NAME-$IMAGE_TAG" \
            "./$SERVICE_PATH"

          docker push "$IMAGE:$SERVICE_NAME"
          docker push "$IMAGE:$SERVICE_NAME-$IMAGE_TAG"

      # - name: Fill in the new image ID in the Amazon ECS task definition

name: Supplier Service Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "supplier-service/**"
      - ".github/workflows/supplier-service-deploy.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "supplier-service/**"
      - ".github/workflows/supplier-service-deploy.yml"

permissions:
  id-token: write
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-southeast-1
      ECR_REPOSITORY: cs3219ay2627s1/p7
      ROLE_TO_ASSUME: arn:aws:iam::551162198630:role/github-actions-connect

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::551162198630:role/github-actions-connect
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./supplier-service
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT


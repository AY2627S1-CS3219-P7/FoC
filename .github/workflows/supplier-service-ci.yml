# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Supplier Service CI

on:
  push:
    branches: ["main"]
    paths:
      - "supplier-service/**"
      - ".github/workflows/supplier-service-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "supplier-service/**"
      - ".github/workflows/supplier-service-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./supplier-service

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.18.0
        uses: actions/setup-node@v4
        with:
          node-version: "20.18.0"
          cache: "npm"
          cache-dependency-path: "./supplier-service/package-lock.json"
      - run: npm ci
      - run: npm run build
      # - run: npm test

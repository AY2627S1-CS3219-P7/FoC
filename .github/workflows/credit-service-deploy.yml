name: Credit Service Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "credit-service/**"
      - ".github/workflows/credit-service-deploy.yml"
      - ".github/workflows/reusable-deploy.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "credit-service/**"
      - ".github/workflows/credit-service-deploy.yml"
      - ".github/workflows/reusable-deploy.yml"

jobs:
  deploy:
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      service-path: "credit-service"
    secrets: inherit

# Scope: Add a standalone Gateway container targeting the host-published backend service ports.
# Author review: Review pending.

services:
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      USER_SERVICE_URL: http://host.docker.internal:3002
      SUPPLIER_SERVICE_URL: http://host.docker.internal:3001
      CREDIT_SERVICE_URL: http://host.docker.internal:3004
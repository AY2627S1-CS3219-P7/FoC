services:
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      PORT: 3005
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-orders}
      APP_URL: ${FRONTEND_ORIGIN:-http://localhost:5173}
      # Leave SNS_TOPIC_ARN empty to only log emails. To send real emails
      # locally, set it plus your temporary AWS credentials in the root .env.
      SNS_TOPIC_ARN: ${SNS_TOPIC_ARN:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3005/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

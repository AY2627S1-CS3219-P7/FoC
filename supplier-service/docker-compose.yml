services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./migrations/up:/docker-entrypoint-initdb.d
      - ./data/postgres:/var/lib/postgresql/data
  api:
    build:
      context: ..
      dockerfile: supplier-service/Dockerfile
    restart: always
    ports:
      - ${PORT:-3001}:3001
    environment:
      - DB_USER=${DB_USER}
      - DB_HOST=postgres
      - DB_DATABASE=${DB_DATABASE}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=5432
    depends_on:
      - postgres
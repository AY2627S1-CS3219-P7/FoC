services:
  credit-service-postgres:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_DB=${CREDIT_DB_DATABASE:-credit_service}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "${CREDIT_DB_EXTERNAL_PORT:-5436}:5432"
    volumes:
      - ./migrations/up:/docker-entrypoint-initdb.d
      - ./data/postgres:/var/lib/postgresql/data
  credit-service-api:
    build:
      context: ..
      dockerfile: credit-service/Dockerfile
    restart: always
    ports:
      - "${CREDIT_PORT:-3004}:3004"
    environment:
      - PORT=3004
      - DB_USER=${DB_USER}
      - DB_HOST=credit-service-postgres
      - DB_DATABASE=${CREDIT_DB_DATABASE:-credit_service}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=5432
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      - credit-service-postgres
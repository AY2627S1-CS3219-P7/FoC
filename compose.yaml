# AI Assistance Disclosure:
# Tool: ChatGPT (model: GPT-5.6 Luna), date: 2026-09-30
# Scope: Root Docker Compose orchestration using Compose V2 include syntax
# Author review: Reviewed and validated against modular multi-service architecture.

include:
  - ./user-service/docker-compose.yml
  - ./supplier-service/docker-compose.yml

services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      USER_SERVICE_URL: http://user-service-api:3002
      SUPPLIER_SERVICE_URL: http://api:3001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      - user-service-api
      - api
    networks:
      - default

networks:
  default:
    name: app-network
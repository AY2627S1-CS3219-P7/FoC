include:
  - ./user-service/docker-compose.yml
  - ./supplier-service/docker-compose.yml
  - ./credit-service/docker-compose.yml

services:
  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      USER_SERVICE_URL: http://user-service-api:3002
      SUPPLIER_SERVICE_URL: http://supplier-service-api:3001
      CREDIT_SERVICE_URL: http://credit-service-api:3004
    depends_on:
      - user-service-api
      - supplier-service-api
      - credit-service-api
    networks:
      - default

networks:
  default:
    name: app-network
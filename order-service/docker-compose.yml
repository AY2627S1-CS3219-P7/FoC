services:
  order-service-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ORDER_DB_DATABASE:-order_service}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      # Host port only, for connecting with a DB client. Containers talk to
      # each other on 5432.
      - "${ORDER_DB_EXTERNAL_PORT:-5435}:5432"
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Shared broker for the root stack. Management UI: http://localhost:15672
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER must be set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # ping only checks the Erlang node. check_port_connectivity waits until
      # the AMQP listener on 5672 accepts clients.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  order-service-api:
    build:
      context: ..
      dockerfile: order-service/Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "${ORDER_PORT:-3003}:3003"
    environment:
      PORT: 3003
      DB_HOST: order-service-postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${ORDER_DB_DATABASE:-order_service}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-orders}
      CREDIT_SERVICE_URL: http://credit-service-api:3004
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      DB_LOGGING: ${DB_LOGGING:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      order-service-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  order_postgres_data:
  rabbitmq_data:
